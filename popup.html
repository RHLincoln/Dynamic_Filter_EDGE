<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DynamicSearchLiteSafe</title>
  <style>
    /* ── Reset & base ─────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #1e1e2e;
      --surface:   #313244;
      --border:    #44475a;
      --text:      #cdd6f4;
      --subtext:   #a6adc8;
      --muted:     #6c7086;
      --blue:      #89b4fa;
      --green:     #a6e3a1;
      --red:       #f38ba8;
      --yellow:    #f9e2af;
      --peach:     #fab387;
      --radius:    6px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      width: 300px;
      min-height: 180px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* ── Header ───────────────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: -0.02em;
    }

    .logo-icon {
      width: 20px;
      height: 20px;
      background: var(--blue);
      border-radius: 4px;
      display: grid;
      place-items: center;
      font-size: 11px;
      color: var(--bg);
      font-weight: 700;
    }

    .version {
      font-size: 10px;
      color: var(--muted);
      align-self: flex-end;
      margin-bottom: 2px;
    }

    /* ── Toggle row ───────────────────────────────────────────────────── */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 10px;
    }

    .toggle-label {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .toggle-label strong { font-size: 13px; }

    .toggle-label small {
      font-size: 11px;
      color: var(--subtext);
    }

    /* Toggle switch */
    .switch {
      position: relative;
      width: 36px;
      height: 20px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }

    .slider {
      position: absolute;
      inset: 0;
      background: var(--border);
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .slider::before {
      content: "";
      position: absolute;
      width: 14px;
      height: 14px;
      left: 3px;
      top: 3px;
      background: var(--text);
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .switch input:checked + .slider { background: var(--blue); }
    .switch input:checked + .slider::before { transform: translateX(16px); }

    /* ── Status indicator ─────────────────────────────────────────────── */
    .status-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .stat {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 80px;
    }

    .stat-label {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .stat-value {
      font-size: 15px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .stat-value.ok   { color: var(--green); }
    .stat-value.warn { color: var(--yellow); }
    .stat-value.off  { color: var(--muted); }

    /* ── Shortcut hint ────────────────────────────────────────────────── */
    .hint {
      font-size: 11px;
      color: var(--muted);
      text-align: center;
    }

    .hint kbd {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 1px 4px;
      font-size: 10px;
      font-family: monospace;
      color: var(--subtext);
    }

    /* ── Debug panel ──────────────────────────────────────────────────── */
    details {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    summary {
      cursor: pointer;
      padding: 6px 10px;
      font-size: 11px;
      color: var(--subtext);
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
    }

    summary::after {
      content: "▸";
      font-size: 10px;
      transition: transform 0.15s;
    }

    details[open] summary::after { transform: rotate(90deg); }

    .debug-toolbar {
      display: flex;
      gap: 6px;
      padding: 4px 10px 0;
    }

    .debug-toolbar button {
      background: var(--border);
      border: none;
      border-radius: 4px;
      color: var(--text);
      cursor: pointer;
      font-size: 11px;
      padding: 3px 8px;
    }

    .debug-toolbar button:hover { background: #585b70; }

    #log-output {
      font-family: "Cascadia Code", "Consolas", monospace;
      font-size: 10px;
      color: var(--subtext);
      height: 120px;
      overflow-y: auto;
      padding: 6px 10px 8px;
      white-space: pre-wrap;
      word-break: break-all;
      line-height: 1.5;
    }

    .log-info  { color: var(--blue); }
    .log-warn  { color: var(--yellow); }
    .log-error { color: var(--red); }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <div class="logo-icon">D</div>
      DynamicSearch
    </div>
    <span class="version">v3.1</span>
  </header>

  <!-- Toggle -->
  <div class="toggle-row">
    <div class="toggle-label">
      <strong id="toggle-text">Enable on this page</strong>
      <small id="toggle-sub">Click to open the in-page search overlay</small>
    </div>
    <label class="switch" aria-label="Toggle search overlay">
      <input type="checkbox" id="enabled-toggle" />
      <span class="slider"></span>
    </label>
  </div>

  <!-- Stats -->
  <div class="status-row">
    <div class="stat">
      <span class="stat-label">Matches</span>
      <span class="stat-value off" id="stat-matches">—</span>
    </div>
    <div class="stat">
      <span class="stat-label">Current</span>
      <span class="stat-value off" id="stat-current">—</span>
    </div>
    <div class="stat">
      <span class="stat-label">Last query</span>
      <span class="stat-value off" id="stat-query" style="font-size:11px;word-break:break-all">—</span>
    </div>
  </div>

  <p class="hint">
    Also: <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>F</kbd> on any page
  </p>

  <!-- Debug panel -->
  <details id="debug-section">
    <summary>🛠 Troubleshooting / Debug log</summary>
    <div class="debug-toolbar">
      <button id="btn-refresh-log">↻ Refresh</button>
      <button id="btn-copy-log">⎘ Copy log</button>
      <button id="btn-clear-log">✕ Clear</button>
    </div>
    <div id="log-output">Loading…</div>
  </details>

  <script src="popup.js"></script>
</body>
</html>
